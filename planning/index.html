<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Trip Planning · Naples Invitational</title>
  <style>
    :root {
      --ink: #0d1b2b; --ink-mid: #1a2d44;
      --gold: #b8943f; --gold-lt: #d4ac58; --gold-pale: #e8d49a;
      --linen: #f4ede0; --linen-warm: #ede3d0; --linen-deep: #e0d4bc;
      --sage: #3d5240; --taupe: #6a5f51; --red: #9b3a2a; --amber: #8a5a00;
      --card: #fffdf8;
      --display: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      --ui: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--linen); color: var(--ink); font-family: var(--ui); font-size: 16px; -webkit-text-size-adjust: 100%; }
    button, input, textarea, select { font: inherit; color: inherit; }
    a { color: var(--sage); }
    .hidden { display: none !important; }

    header { background: var(--ink); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 16px; border-bottom: 3px solid var(--gold); }
    .back { color: var(--gold-lt); text-decoration: none; font-size: 14px; letter-spacing: 0.08em; }
    h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 6px 0 2px; letter-spacing: 0.04em; }
    .sub { color: var(--gold-pale); font-size: 14px; }
    .progress { margin-top: 12px; }
    .bar { height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--gold); }
    .progress-text { display: flex; justify-content: space-between; font-size: 13px; color: var(--gold-pale); margin-top: 6px; }

    main { max-width: 860px; margin: 0 auto; padding: 12px 12px 80px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
    .chip { border: 1.5px solid var(--sage); background: transparent; color: var(--sage); border-radius: 18px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .chip.on { background: var(--sage); color: #fff; }
    .spacer { flex: 1; }
    .linkbtn { background: none; border: 0; color: var(--sage); font-weight: 600; cursor: pointer; padding: 6px 4px; font-size: 14px; }

    .card { background: var(--card); border: 1px solid var(--linen-deep); border-radius: 12px; overflow: hidden; }
    .row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px; border-top: 1px solid var(--linen-warm); }
    .row:first-child { border-top: 0; }
    .row.parent { background: #faf5ea; }
    .twisty { width: 28px; height: 28px; flex: none; border: 0; background: none; cursor: pointer; font-size: 14px; color: var(--taupe); display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    .twisty:hover { background: var(--linen-warm); }
    .twisty.leaf { visibility: hidden; }
    .check { width: 26px; height: 26px; flex: none; border: 2px solid var(--taupe); border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .check.done { background: var(--sage); border-color: var(--sage); color: #fff; }
    button.check { cursor: pointer; padding: 0; }
    .check.rollup { border-style: dashed; font-size: 11px; font-weight: 700; color: var(--taupe); }
    .body { flex: 1; min-width: 0; }
    .title { font-size: 17px; font-weight: 600; line-height: 1.3; word-break: break-word; }
    .row.is-done .title { color: var(--taupe); text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.35); }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 13.5px; color: var(--taupe); align-items: center; }
    .pill { border-radius: 10px; padding: 1px 8px; font-size: 12.5px; font-weight: 700; }
    .pill.overdue { background: #f6dcd6; color: var(--red); }
    .pill.soon { background: #f6ead0; color: var(--amber); }
    .pill.blocked { background: #e7e3f2; color: #4b3f80; }
    .pill.count { background: var(--linen-warm); color: var(--taupe); }
    .comment { margin-top: 6px; font-size: 14.5px; color: #3c3a36; white-space: pre-wrap; word-break: break-word; }
    .edit { flex: none; background: none; border: 0; color: var(--sage); font-weight: 600; font-size: 14px; cursor: pointer; padding: 4px 2px; }
    .empty { padding: 24px; text-align: center; color: var(--taupe); }

    /* Editor sheet */
    .sheet-back { position: fixed; inset: 0; background: rgba(13,27,43,0.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    @media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; } }
    .sheet h2 { font-family: var(--display); font-weight: 400; margin: 0 0 12px; font-size: 22px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--taupe); margin-bottom: 6px; text-transform: uppercase; }
    .field input[type=text], .field input[type=date], .field textarea, .field select { width: 100%; border: 1px solid var(--linen-deep); border-radius: 8px; padding: 10px 12px; background: #fff; font-size: 16px; }
    .field textarea { min-height: 80px; resize: vertical; }
    .deps { max-height: 190px; overflow: auto; border: 1px solid var(--linen-deep); border-radius: 8px; background: #fff; }
    .deps label { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--linen-warm); font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; margin: 0; }
    .deps label:first-child { border-top: 0; }
    .row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .btn { border: 0; border-radius: 8px; padding: 11px 16px; font-weight: 700; cursor: pointer; background: var(--sage); color: #fff; }
    .btn.secondary { background: #fff; color: var(--sage); border: 1.5px solid var(--sage); }
    .btn.danger { background: #fff; color: var(--red); border: 1.5px solid var(--red); }
    .err { color: var(--red); font-size: 14px; margin-top: 8px; }
    .signin input { width: 100%; border: 1px solid var(--linen-deep); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 16px; }
    .foot { text-align: center; color: var(--taupe); font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../">‹ Naples Invitational</a>
    <h1>Trip Planning</h1>
    <div class="sub" id="sub">Everything to sort out before January 6</div>
    <div class="progress">
      <div class="bar"><div id="barFill" style="width:0%"></div></div>
      <div class="progress-text"><span id="progressText">Loading…</span><span id="countdown"></span></div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <button class="chip on" data-filter="all" type="button">All</button>
      <button class="chip" data-filter="open" type="button">To do</button>
      <button class="chip" data-filter="overdue" type="button">Overdue</button>
      <span class="spacer"></span>
      <button class="linkbtn" id="foldAll" type="button">Collapse all</button>
    </div>

    <div class="card" id="list"><div class="empty">Loading…</div></div>

    <div class="toolbar" id="adminBar" style="margin-top:12px">
      <button class="btn hidden" id="addTop" type="button">+ Add task</button>
      <span class="spacer"></span>
      <button class="linkbtn" id="adminBtn" type="button">Organizer sign-in</button>
    </div>
    <p class="foot" id="foot"></p>
    <p class="err" id="pageErr"></p>
  </main>

  <!-- Task editor -->
  <div class="sheet-back hidden" id="editor">
    <form class="sheet" id="editForm">
      <h2 id="editTitle">Edit task</h2>
      <div class="field"><label for="fTitle">Task</label><input type="text" id="fTitle" required maxlength="120"></div>
      <div class="field"><label for="fParent">Part of</label><select id="fParent"></select></div>
      <div class="field"><label for="fDue">Due date</label><input type="date" id="fDue"></div>
      <div class="field"><label><input type="checkbox" id="fDone" style="width:auto;margin-right:8px">Completed</label></div>
      <div class="field"><label for="fComment">Comment</label><textarea id="fComment" maxlength="2000"></textarea></div>
      <div class="field"><label>Waits on (must be done first)</label><div class="deps" id="fDeps"></div></div>
      <div class="row-btns">
        <button class="btn" type="submit" id="saveBtn">Save</button>
        <button class="btn secondary" type="button" id="cancelBtn">Cancel</button>
        <span class="spacer"></span>
        <button class="btn secondary" type="button" id="addSubBtn">+ Subtask</button>
        <button class="btn secondary" type="button" id="upBtn" title="Move up">▲</button>
        <button class="btn secondary" type="button" id="downBtn" title="Move down">▼</button>
        <button class="btn danger" type="button" id="deleteBtn">Delete</button>
      </div>
      <p class="err" id="editErr"></p>
    </form>
  </div>

  <!-- Organizer sign-in -->
  <div class="sheet-back hidden" id="signIn">
    <form class="sheet signin" id="signInForm">
      <h2>Organizer sign-in</h2>
      <input type="email" id="email" placeholder="Admin email" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <div class="row-btns">
        <button class="btn" type="submit">Sign in</button>
        <button class="btn secondary" type="button" id="cancelSignIn">Cancel</button>
      </div>
      <p class="err" id="signInErr"></p>
    </form>
  </div>

  <!-- Bump ?v= on every change: Hostinger's CDN caches .js files and keys on the full URL -->
  <script type="module" src="app.js?v=20261112a"></script>
</body>
</html>
