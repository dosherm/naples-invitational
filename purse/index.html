<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Purse &amp; Payouts · Naples Invitational</title>
  <style>
    :root {
      --ink: #0d1b2b; --gold: #b8943f; --gold-lt: #d4ac58; --gold-pale: #e8d49a;
      --linen: #f4ede0; --linen-warm: #ede3d0; --linen-deep: #e0d4bc;
      --sage: #3d5240; --taupe: #6a5f51; --card: #fffdf8;
      --display: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      --ui: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--linen); color: var(--ink); font-family: var(--ui); font-size: 16px; -webkit-text-size-adjust: 100%; }
    header { background: var(--ink); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 18px; border-bottom: 3px solid var(--gold); }
    .back { color: var(--gold-lt); text-decoration: none; font-size: 14px; letter-spacing: 0.08em; margin-right: 14px; }
    h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 8px 0 2px; letter-spacing: 0.04em; }
    .sub { color: var(--gold-pale); font-size: 14px; }
    main { max-width: 760px; margin: 0 auto; padding: 14px 12px 60px; }
    h2 { font-family: var(--display); font-weight: 400; font-size: 21px; margin: 26px 4px 10px; }
    .card { background: var(--card); border: 1px solid var(--linen-deep); border-radius: 12px; padding: 14px; }
    .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .big3 .n { font-family: var(--display); font-size: 30px; }
    .big3 .l { font-size: 12.5px; color: var(--taupe); letter-spacing: 0.06em; text-transform: uppercase; }
    .op { font-size: 22px; color: var(--taupe); align-self: center; }
    .eq { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; text-align: center; gap: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--taupe); font-weight: 700; padding: 6px 4px; border-bottom: 2px solid var(--linen-deep); }
    td { padding: 10px 4px; border-bottom: 1px solid var(--linen-warm); vertical-align: top; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    td .how { display: block; font-size: 13.5px; color: var(--taupe); margin-top: 2px; }
    tr.total td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); }
    .ledger td { padding: 9px 4px; }
    .ledger tr.remaining td { background: #faf1dc; }
    .ledger tr.balance td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 0; }
    .ok { color: var(--sage); }
    .note { font-size: 14px; color: var(--taupe); margin: 8px 4px 0; line-height: 1.45; }
    .bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 10px 0 6px; }
    .bar div { height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--taupe); }
    .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; background: var(--c); }
    .days { display: grid; gap: 8px; }
    .day { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linen-warm); }
    .day:last-child { border-bottom: 0; }
    .day b { display: block; }
    .day small { color: var(--taupe); font-size: 13.5px; }
    .pill { display: inline-block; background: #f6ead0; color: #8a5a00; border-radius: 10px; padding: 1px 8px; font-size: 12.5px; font-weight: 700; }
    .n.big { font-family: var(--display); font-size: 30px; }
    .l { font-size: 12.5px; color: var(--taupe); letter-spacing: 0.06em; text-transform: uppercase; }
    .warn { color: #9b3a2a; }
    .daydetail { padding: 4px 0 12px; border-bottom: 1px solid var(--linen-warm); }
    @media (max-width: 420px) { .n.big { font-size: 24px; } }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../">‹ Naples Invitational</a><a class="back" href="../planning/">Trip Planning</a>
    <h1>Purse &amp; Payouts</h1>
    <div class="sub">Where every dollar goes, and how it adds up</div>
  </header>

  <main id="main"><div class="card">Loading the purse…</div></main>

  <!-- Bump ?v= on every change: Hostinger's CDN caches .js files and keys on the full URL -->
  <script type="module" src="app.js?v=20261112b"></script>
</body>
</html>
